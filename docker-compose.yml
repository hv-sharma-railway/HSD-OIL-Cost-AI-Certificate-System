services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - railway-data:/app/data
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/railway.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    restart: always

  db-browser:
    image: coleifer/sqlite-web
    ports:
      - "8080:8080"
    volumes:
      - railway-data:/data
    environment:
      - SQLITE_DATABASE=railway.db
    command: ["sh", "-c", "while [ ! -f /data/railway.db ]; do sleep 1; done; exec sqlite_web -H 0.0.0.0 -x /data/railway.db"]
    depends_on:
      - app
    restart: always

volumes:
  railway-data:
