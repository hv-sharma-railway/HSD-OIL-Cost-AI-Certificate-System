version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - railway-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/railway.db
    restart: always

  db-browser:
    image: coleifer/sqlite-web
    ports:
      - "8080:8080"
    volumes:
      - railway-data:/data
    environment:
      - SQLITE_DATABASE=railway.db
    entrypoint: ["sh", "-c"]
    command: ["touch /data/railway.db 2>/dev/null || true; exec sqlite_web -H 0.0.0.0 -p 8080 -x /data/railway.db"]
    depends_on:
      - app
    restart: always

volumes:
  railway-data:
